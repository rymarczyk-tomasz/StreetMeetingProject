# Headers for the SPA (the API sets its own via helmet). Included in every static
# location, because add_header in a location drops the server-level ones.
# The Google and Facebook hosts are Google Tag Manager, GA4 and Meta Pixel (frontend/public/js/consent.js);
# a new tool in GTM needs its hosts here too, and GTM "Custom HTML" tags (inline scripts) stay blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://stats.g.doubleclick.net https://www.facebook.com; media-src 'self' blob:; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://connect.facebook.net https://www.facebook.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
