# Street Show behind Cloudflare (SSL mode "Full (strict)", Cloudflare Origin Certificate).
# Placeholders are filled in by deploy/setup.sh: __APEX__, __DOMAIN__, __APP_DIR__, __API_PORT__.
# With APEX=none (e.g. a staging subdomain) setup.sh drops the apex redirect block.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __APEX__;
    return 301 https://__DOMAIN__$request_uri;
}

# apex-start
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __APEX__;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://__DOMAIN__$request_uri;
}
# apex-end

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    root __APP_DIR__/frontend/dist;
    index index.html;

    # Submissions accept up to 5 photos / 50 MB.
    client_max_body_size 55m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        include /etc/nginx/snippets/streetshow-proxy.conf;
    }

    # The backend serves only /uploads/content and /uploads/gallery; private photos
    # (submissions, vehicles, showcase) go through /api with permission checks.
    location /uploads/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        include /etc/nginx/snippets/streetshow-proxy.conf;
    }

    # Addresses of the old static site, still in Google and in shared links.
    location = /faq.html { return 301 /faq; }
    location = /galeria.html { return 301 /galeria; }
    location = /regulamin.html { return 301 /regulamin; }

    location = /sw.js {
        include /etc/nginx/snippets/streetshow-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/streetshow-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/streetshow-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
