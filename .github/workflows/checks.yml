name: Checks

# shared by ci.yml (every branch / PR) and deploy.yml (before deploying newProject)
on:
    workflow_call:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npm run build
            - run: npm test

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm test

    # real browser clicking through the app against a throwaway backend
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      backend/package-lock.json
                      frontend/package-lock.json
                      e2e/package-lock.json
            - name: Build backend
              working-directory: backend
              run: |
                  npm ci
                  npm run build
            - name: Install frontend
              working-directory: frontend
              run: npm ci
            - name: Install Playwright
              working-directory: e2e
              run: |
                  npm ci
                  npx playwright install --with-deps chromium
            - name: Run e2e
              working-directory: e2e
              run: npx playwright test
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      e2e/playwright-report/
                      e2e/test-results/
                  retention-days: 7
