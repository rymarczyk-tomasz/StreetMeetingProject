name: Deploy Street Show

# newProject → Mikrus (the client's test server, MIKRUS_* secrets)
# production → OVH (secrets DEPLOY_HOST / DEPLOY_SSH_KEY, variables DEPLOY_USER / DEPLOY_PORT / DEPLOY_PATH)
on:
    push:
        branches:
            - newProject
            - production
    workflow_dispatch:

concurrency:
    group: streetshow-deploy-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    # unit, api and e2e tests must pass before anything touches the server
    checks:
        uses: ./.github/workflows/checks.yml

    deploy:
        needs: checks
        if: github.ref_name == 'newProject' || github.ref_name == 'production'
        runs-on: ubuntu-latest
        env:
            IS_PRODUCTION: ${{ github.ref_name == 'production' }}
        steps:
            - name: Check production secrets
              if: env.IS_PRODUCTION == 'true'
              env:
                  HOST: ${{ secrets.DEPLOY_HOST }}
                  KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  if [ -z "$HOST" ] || [ -z "$KEY" ]; then
                    echo "Brak sekretów DEPLOY_HOST / DEPLOY_SSH_KEY - nie wdrażam produkcji." >&2
                    exit 1
                  fi

            - name: Deploy over SSH
              # pinned to a commit: this action receives the server's SSH key
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              env:
                  BRANCH: ${{ github.ref_name }}
                  APP_DIR: ${{ env.IS_PRODUCTION == 'true' && (vars.DEPLOY_PATH || '/home/streetshow/streetshow') || '/root/streetshow' }}
                  API_PORT: ${{ vars.API_PORT || '4001' }}
                  # Mikrus is the client's test server: no working e-mail there
                  IS_MIKRUS: ${{ env.IS_PRODUCTION != 'true' }}
              with:
                  host: ${{ env.IS_PRODUCTION == 'true' && secrets.DEPLOY_HOST || secrets.MIKRUS_HOST }}
                  username: ${{ env.IS_PRODUCTION == 'true' && (vars.DEPLOY_USER || 'streetshow') || 'root' }}
                  key: ${{ env.IS_PRODUCTION == 'true' && secrets.DEPLOY_SSH_KEY || secrets.MIKRUS_SSH_KEY }}
                  port: ${{ env.IS_PRODUCTION == 'true' && (vars.DEPLOY_PORT || '22') || '10192' }}
                  envs: BRANCH,APP_DIR,API_PORT,IS_MIKRUS
                  script: |
                      set -eu

                      cd "$APP_DIR"
                      git restore backend/package-lock.json frontend/package-lock.json
                      git fetch --quiet origin "$BRANCH"
                      git checkout --quiet -B "$BRANCH" "origin/$BRANCH"

                      cd "$APP_DIR/backend"
                      npm ci
                      npm run build

                      # test server only: no e-mail confirmation, no admin 2FA (see backend/src/testMode.ts)
                      if [ "$IS_MIKRUS" = "true" ] && ! grep -q '^TEST_MODE=' config/.env 2>/dev/null; then
                        printf '\nTEST_MODE=on\n' >> config/.env
                        echo "TEST_MODE=on dopisany do config/.env (Mikrus)"
                      fi

                      # built next to the live copy and swapped in, so the site never serves a half-empty dist
                      cd "$APP_DIR/frontend"
                      npm ci
                      rm -rf dist-next
                      npm run build -- --outDir dist-next --emptyOutDir
                      rm -rf dist-prev
                      [ -d dist ] && mv dist dist-prev
                      mv dist-next dist

                      pm2 restart streetshow-api --update-env
                      pm2 save

                      for attempt in $(seq 1 15); do
                        if curl --fail --silent "http://127.0.0.1:$API_PORT/api/health" >/dev/null; then
                          echo "Healthcheck OK"
                          exit 0
                        fi
                        sleep 2
                      done

                      # Show why the API didn't come up, right in the GitHub Actions log.
                      echo "streetshow-api did not respond in time" >&2
                      echo "node $(node -v)" >&2
                      pm2 describe streetshow-api >&2 || true
                      pm2 logs streetshow-api --lines 80 --nostream >&2 || true
                      exit 1
