name: Deploy Street Show

on:
    push:
        branches:
            - newProject
    workflow_dispatch:

concurrency:
    group: streetshow-production
    cancel-in-progress: true

jobs:
    # Catch TypeScript/build errors on GitHub before anything touches the server.
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Build backend
              working-directory: backend
              run: |
                  npm ci
                  npm run build
            - name: Build frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm run build

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to Mikrus
              uses: appleboy/ssh-action@v1.2.2
              with:
                  host: ${{ secrets.MIKRUS_HOST }}
                  username: root
                  key: ${{ secrets.MIKRUS_SSH_KEY }}
                  port: 10192
                  script: |
                      set -eu

                      cd /root/streetshow
                      git restore backend/package-lock.json frontend/package-lock.json
                      git pull --ff-only origin newProject

                      cd /root/streetshow/backend
                      npm ci
                      npm run build

                      cd /root/streetshow/frontend
                      npm ci
                      npm run build

                      pm2 restart streetshow-api --update-env
                      pm2 save

                      for attempt in $(seq 1 15); do
                        if curl --fail --silent http://127.0.0.1:4001/api/health >/dev/null; then
                          echo "Healthcheck OK"
                          exit 0
                        fi
                        sleep 2
                      done

                      # Show why the API didn't come up, right in the GitHub Actions log.
                      echo "streetshow-api did not respond in time" >&2
                      echo "node $(node -v)" >&2
                      pm2 describe streetshow-api >&2 || true
                      pm2 logs streetshow-api --lines 80 --nostream >&2 || true
                      exit 1
